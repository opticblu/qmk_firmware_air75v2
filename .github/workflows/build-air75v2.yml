name: Build Air75 V2 Firmware

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Commit or branch to build
        required: false
        default: ""
  push:
    branches:
      - air75v2-sleep
    paths:
      - keyboards/nuphy/air75_v2/ansi/**
      - .github/workflows/build-air75v2.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli

    steps:
      - name: Disable safe.directory check
        run: git config --global --add safe.directory '*'

      - name: Checkout QMK Firmware
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || github.sha }}

      - name: Install Python requirements
        run: |
          if [ -x /opt/uv/tools/qmk/bin/python3 ]; then
            /opt/uv/tools/qmk/bin/python3 -m pip install -r requirements.txt
          else
            python3 -m pip install -r requirements.txt
          fi

      - name: Deploy submodules
        run: qmk git-submodule -f

      - name: Build firmware
        run: qmk compile -kb nuphy/air75_v2/ansi -km via

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: air75v2-via-firmware
          if-no-files-found: error
          path: "*.bin"
